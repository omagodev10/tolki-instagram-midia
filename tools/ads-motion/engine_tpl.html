<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Montserrat;font-weight:900;src:url('__F__/montserrat/files/montserrat-latin-900-normal.woff2')}
@font-face{font-family:Inter;font-weight:400;src:url('__F__/inter/files/inter-latin-400-normal.woff2')}
@font-face{font-family:Inter;font-weight:600;src:url('__F__/inter/files/inter-latin-600-normal.woff2')}
@font-face{font-family:Inter;font-weight:700;src:url('__F__/inter/files/inter-latin-700-normal.woff2')}
@font-face{font-family:Serif;font-style:italic;src:url('__CF__/InstrumentSerif-Italic.ttf')}
@font-face{font-family:Mono;src:url('__CF__/DMMono-Regular.ttf')}
body{margin:0}#R{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Inter}
.sc{position:absolute;inset:0;opacity:0}.ab{position:absolute}
.M{font-family:Montserrat;font-weight:900;text-transform:uppercase;letter-spacing:-2px;line-height:.95}
.S{font-family:Serif;font-style:italic;line-height:1.02}.mono{font-family:Mono;letter-spacing:3px;text-transform:uppercase}
</style></head><body><div id="R"><div id="scenes"></div>
<div class="ab" id="chrome" style="left:90px;right:90px;top:150px;display:flex;justify-content:space-between;align-items:center;font-family:Mono;font-size:24px;letter-spacing:3px;color:#fff"><span style="display:flex;align-items:center;gap:14px"><span style="width:52px;height:52px;border-radius:50%;background:#8A3FD1;display:flex;align-items:center;justify-content:center"><img src="__ICON__" style="width:38px"></span>TOLKI</span><span>@tolkibrasil</span></div>
<div class="ab" style="left:80px;right:80px;top:1290px;text-align:center"><span id="capt" style="display:inline-block;font:700 54px/1.15 Inter;padding:14px 26px;border-radius:12px"></span></div>
</div>
<script>
// Motor de anúncios motion da Tolki. Área útil para anúncio: y 260 a 1250 (a interface dos Reels cobre o rodapé).
const SPEC=__SPEC__, SC=__SCENES__, TOTAL=__TOTAL__;
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eb=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function rise(el,t,t0,d,dy){if(!el)return;d=d||.45;dy=dy||60;const p=eb((t-t0)/d);el.style.opacity=cl((t-t0)/(d*.6));el.style.transform='translateY('+((1-p)*dy)+'px)';}
const LIGHT=c=>{c=c.replace('#','');const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);return (r*299+g*587+b*114)/1000>150;};
const T={}; // renderers: html(i,s) e tick(i,s,t) com t relativo ao início da cena
const ink=s=>s.color||(LIGHT(s.bg)?'#0E1A2B':'#FFFFFF');
const ill=(i,s,top)=>s.illus?'<div class="ab mono" style="left:90px;top:'+(top||1200)+'px;font-size:22px;color:'+ink(s)+';opacity:.55">'+s.illus+'</div>':'';

T.text={html:(i,s)=>`${s.kicker?`<div class="ab mono" id="k${i}" style="left:90px;top:300px;font-size:30px;color:${s.accent||'#1AA6E3'}">${s.kicker}</div>`:''}
<div class="ab M" id="a${i}" style="left:90px;right:90px;top:${s.kicker?370:330}px;font-size:${s.size||118}px;color:${ink(s)}">${s.title}</div>
${s.sub?`<div class="ab S" id="b${i}" style="left:90px;right:90px;top:${s.subTop||800}px;font-size:${s.subSize||104}px;color:${s.accent||'#C9A6F4'}">${s.sub}</div>`:''}${ill(i,s)}`,
 tick:(i,s,t)=>{rise($('k'+i),t,0.0);rise($('a'+i),t,0.08);rise($('b'+i),t,0.5);}};

T.big={html:(i,s)=>`<div class="ab mono" style="left:90px;top:320px;font-size:30px;color:${s.accent||'#1AA6E3'}">${s.kicker||''}</div>
<div class="ab M" id="n${i}" style="left:70px;top:400px;font-size:${s.size||300}px;color:${ink(s)};letter-spacing:-12px;white-space:nowrap"></div>
<div class="ab" style="left:90px;right:90px;top:${(s.size||300)+440}px;height:22px;background:rgba(127,127,127,.25);border-radius:4px;overflow:hidden"><div id="bar${i}" style="height:100%;width:0;background:${s.accent||'#1AA6E3'}"></div></div>
<div class="ab S" id="b${i}" style="left:90px;right:90px;top:${(s.size||300)+510}px;font-size:${s.subSize||92}px;color:${s.subColor||s.accent||'#C9A6F4'}">${s.sub||''}</div>${ill(i,s)}`,
 tick:(i,s,t)=>{const p=eo(t/(s.countDur||1.6));const v=Math.round(s.from+(s.to-s.from)*p);$('n'+i).textContent=(s.prefix||'')+v.toLocaleString('pt-BR')+(s.suffix||'');$('bar'+i).style.width=(100*p)+'%';rise($('b'+i),t,(s.countDur||1.6)*.7);}};

T.beforeafter={html:(i,s)=>`<div class="ab mono" style="left:90px;top:320px;font-size:30px;color:${s.accent}">${s.kicker||''}</div>
<div class="ab" id="x${i}" style="left:90px;top:400px;"><span class="M" style="font-size:240px;color:${ink(s)};opacity:.45;letter-spacing:-8px">${s.before}</span><div id="st${i}" style="position:absolute;left:-10px;top:110px;height:18px;width:0;background:${s.strike||'#FF4D4D'};transform:rotate(-8deg)"></div></div>
<div class="ab M" id="y${i}" style="left:90px;top:660px;font-size:330px;color:${s.accent};letter-spacing:-14px;white-space:nowrap">${s.after}</div>
<div class="ab S" id="b${i}" style="left:90px;right:90px;top:1020px;font-size:84px;color:${ink(s)}">${s.sub||''}</div>`,
 tick:(i,s,t)=>{rise($('x'+i),t,0);$('st'+i).style.width=(eo((t-0.6)/.35)*520)+'px';const y=$('y'+i);const p=eb((t-1.0)/.4);y.style.opacity=cl((t-1.0)/.2);y.style.transform='scale('+(0.6+0.4*p)+')';y.style.transformOrigin='left center';rise($('b'+i),t,1.6);}};

T.chat={html:(i,s)=>`<div class="ab mono" style="left:90px;top:300px;font-size:28px;color:#8E8E93">WhatsApp · ${s.time||'21:12'}</div>
<div class="ab" id="bub${i}" style="left:90px;top:370px;max-width:800px;background:#1F2C34;color:#E9EDEF;border-radius:30px 30px 30px 8px;padding:34px 40px;font-size:50px;line-height:1.3">${s.msg}<div style="text-align:right;font-size:24px;color:#8696A0;margin-top:8px">${s.time||'21:12'}</div></div>
<div class="ab" id="w${i}" style="left:90px;top:${s.waitTop||660}px;font-size:34px;color:#8E8E93;font-family:Mono"></div>
${s.title?`<div class="ab M" id="a${i}" style="left:90px;right:90px;top:${s.titleTop||780}px;font-size:${s.size||104}px;color:#fff">${s.title}</div>`:''}
${s.stamp?`<div class="ab M" id="sp${i}" style="left:100px;top:${s.stampTop||1060}px;font-size:52px;white-space:nowrap;color:#fff;background:${s.stampBg||'#8A3FD1'};padding:22px 34px;border-radius:10px;letter-spacing:0">${s.stamp}</div>`:''}${ill(i,s,1220)}`,
 tick:(i,s,t,d)=>{rise($('bub'+i),t,0.05);const w0=s.waitAt||0.6;const mins=Math.floor(Math.max(0,t-w0)*(s.speed||220));$('w'+i).textContent=t>w0?((s.waitLabel||'sem resposta há ')+Math.floor(mins/60)+'h'+String(mins%60).padStart(2,'0')):'';rise($('a'+i),t,s.titleAt||1.0);
 const sp=$('sp'+i);if(sp){const ts=s.stampAt||Math.max(1.4,d-1.3);const p=eb((t-ts)/.3);sp.style.opacity=t>ts?1:0;sp.style.transform='rotate(-6deg) scale('+(t>ts?2.2-1.2*p:2.2)+')';}}};

T.reply={html:(i,s)=>`<div class="ab" style="left:60px;right:60px;top:280px;bottom:740px;background:#0B141A;border-radius:36px;overflow:hidden">
<div style="background:#1F2C34;padding:26px 34px;display:flex;align-items:center;gap:20px"><div style="width:70px;height:70px;border-radius:50%;background:#8A3FD1;display:flex;align-items:center;justify-content:center"><img src="__ICON__" style="width:50px"></div><div><div style="font:700 34px Inter;color:#E9EDEF">${s.name||'Clínica'}</div><div id="st${i}" style="font:400 24px Inter;color:#25D366">online</div></div></div>
<div id="m${i}" style="padding:26px 30px;display:flex;flex-direction:column;gap:18px"></div></div>
${s.badge?`<div class="ab M" id="bd${i}" style="left:90px;top:1210px;font-size:44px;white-space:nowrap;color:#0E1A2B;background:#25D366;padding:16px 26px;border-radius:10px;letter-spacing:0;opacity:0">${s.badge}</div>`:''}
<div class="ab mono" style="right:90px;top:1150px;font-size:22px;color:#fff;opacity:.55">${s.illus||'exemplo ilustrativo'}</div>`,
 init:(i,s)=>{$('m'+i).innerHTML=s.msgs.map((m,k)=>`<div id="mm${i}_${k}" style="align-self:${m.from=='p'?'flex-start':'flex-end'};max-width:760px;background:${m.from=='p'?'#1F2C34':'#005C4B'};color:#E9EDEF;border-radius:${m.from=='p'?'26px 26px 26px 6px':'26px 26px 6px 26px'};padding:20px 28px;font:400 36px/1.32 Inter;opacity:0">${m.text}<div style="text-align:right;font-size:20px;color:#8696A0;margin-top:4px">${m.time||''}</div></div>`).join('');},
 tick:(i,s,t)=>{let typing=false;s.msgs.forEach((m,k)=>{const at=m.at;const e=$('mm'+i+'_'+k);if(m.from=='t'&&t>at-0.7&&t<at)typing=true;rise(e,t,at,.35,40);});$('st'+i).textContent=typing?'digitando...':'online';const bd=$('bd'+i);if(bd){const ts=s.badgeAt||2.6;const p=eb((t-ts)/.3);bd.style.opacity=t>ts?1:0;bd.style.transform='scale('+(t>ts?1.6-.6*p:1.6)+')';}}};

T.stack={html:(i,s)=>`<div class="ab M" id="a${i}" style="left:90px;right:280px;top:300px;font-size:${s.size||96}px;color:${ink(s)}">${s.title}</div>
<div class="ab" id="pile${i}" style="left:90px;right:90px;top:${s.pileTop||620}px;height:520px;overflow:hidden"></div>
<div class="ab M" id="cnt${i}" style="right:80px;top:300px;min-width:150px;height:150px;border-radius:75px;background:#25D366;color:#fff;font-size:80px;display:flex;align-items:center;justify-content:center;letter-spacing:-3px;padding:0 20px;box-sizing:border-box">0</div>${ill(i,s,1234)}`,
 init:(i,s)=>{const nm=s.names||['Paciente · avaliação','Paciente · clareamento','Paciente · implante','Paciente · retorno','Paciente · botox','Paciente · aparelho','Paciente · limpeza','Paciente · harmonização'];let h='';for(let k=0;k<12;k++)h+=`<div id="p${i}_${k}" style="display:flex;align-items:center;gap:22px;background:#fff;border-radius:22px;padding:20px 26px;margin-bottom:14px;box-shadow:0 2px 0 rgba(0,0,0,.08);opacity:0"><div style="width:64px;height:64px;border-radius:50%;background:#E7EAEE"></div><div style="flex:1"><div style="font:700 30px Inter;color:#0E1A2B">${nm[k%nm.length]}</div><div style="font:400 24px Inter;color:#8A94A0">${(s.msgs||['Oi, quanto fica?','Tem horário amanhã?','Vocês atendem sábado?','Qual o valor?'])[k%4]}</div></div><div style="font:600 22px Inter;color:#25D366">agora</div></div>`;$('pile'+i).innerHTML=h;},
 tick:(i,s,t)=>{rise($('a'+i),t,0.05);const step=s.step||0.22;for(let k=0;k<12;k++){const at=0.5+k*step;const e=$('p'+i+'_'+k);e.style.opacity=t>at?1:0;e.style.transform='translateY('+(t>at?(1-eo((t-at)/.25))*-60:0)+'px)';}
 const pile=$('pile'+i);const n=Math.max(0,Math.floor((t-0.5)/step)+1);pile.style.transform='translateY('+(-Math.max(0,n-5)*0)+'px)';$('pile'+i).style.display='flex';$('pile'+i).style.flexDirection='column-reverse';
 const c=Math.min(s.n||40,Math.round((s.n||40)*eo((t-0.5)/(s.countDur||2.6))));$('cnt'+i).textContent=t>0.5?c:0;}};

T.calc={html:(i,s)=>`${s.kicker?`<div class="ab mono" style="left:90px;top:300px;font-size:30px;color:${s.accent||'#1AA6E3'}">${s.kicker}</div>`:''}
<div class="ab" id="rows${i}" style="left:90px;right:90px;top:380px"></div>${ill(i,s,1200)}`,
 init:(i,s)=>{$('rows'+i).innerHTML=s.rows.map((r,k)=>`<div id="r${i}_${k}" style="display:flex;justify-content:space-between;align-items:baseline;padding:26px 0;border-bottom:3px solid ${LIGHT(s.bg)?'#E3E7EC':'#22324A'};opacity:0"><span style="font:600 46px Inter;color:${ink(s)}">${r[0]}</span><span class="M" style="white-space:nowrap;font-size:${k==s.rows.length-1?130:90}px;color:${k==s.rows.length-1?(s.accent||'#FF4D4D'):ink(s)};letter-spacing:-3px">${r[1]}</span></div>`).join('');},
 tick:(i,s,t)=>{s.rows.forEach((r,k)=>rise($('r'+i+'_'+k),t,(s.at||[0.1,0.9,1.8,2.6])[k]||0.1+k*0.9,.4,50));}};

T.grid={html:(i,s)=>`<div class="ab M" id="a${i}" style="left:90px;right:90px;top:290px;font-size:${s.size||88}px;color:${ink(s)}">${s.title}</div>
${s.sub?`<div class="ab S" id="b${i}" style="left:90px;right:90px;top:${s.subTop||640}px;font-size:${s.subSize||104}px;color:${s.accent||'#8A3FD1'}">${s.sub}</div>`:''}
<div class="ab" id="g${i}" style="left:90px;right:90px;top:${s.gridTop||800}px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px"></div>`,
 init:(i,s)=>{let g='';for(let k=0;k<12;k++)g+=`<div style="height:110px;border-radius:12px;background:${LIGHT(s.bg)?'#F2F4F7':'#1B2A40'};font:700 22px Inter;color:#fff;padding:12px;box-sizing:border-box;position:relative;overflow:hidden"><div id="gf${i}_${k}" style="position:absolute;inset:0;background:${s.fill||'#1597D4'};transform:scaleY(0);transform-origin:bottom"></div><span style="position:relative;opacity:0" id="gl${i}_${k}">Agendado</span></div>`;$('g'+i).innerHTML=g;},
 tick:(i,s,t)=>{rise($('a'+i),t,0.05);rise($('b'+i),t,0.4);rise($('g'+i),t,0.7,.5,80);[0,5,2,9,3,7,1,10,6,4,11,8].forEach((k,j)=>{const ti=1.1+j*(s.step||0.22);$('gf'+i+'_'+k).style.transform='scaleY('+(t>ti?eo((t-ti)/.3):0)+')';$('gl'+i+'_'+k).style.opacity=cl((t-ti-.15)/.2);});}};

T.list={html:(i,s)=>`<div class="ab M" id="a${i}" style="left:90px;right:90px;top:300px;font-size:${s.size||92}px;color:${ink(s)}">${s.title}</div>
<div class="ab" id="l${i}" style="left:90px;right:90px;top:${s.listTop||620}px"></div>`,
 init:(i,s)=>{$('l'+i).innerHTML=s.items.map((x,k)=>`<div id="li${i}_${k}" style="display:flex;align-items:center;gap:28px;padding:20px 0;opacity:0"><svg width="76" height="76" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="${s.accent||'#1AA6E3'}"/><path d="M6.5 12.5l3.5 3.5L17.5 8.5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg><span class="M" style="font-size:${s.itemSize||74}px;color:${ink(s)};letter-spacing:-1px">${x}</span></div>`).join('');},
 tick:(i,s,t)=>{rise($('a'+i),t,0.05);s.items.forEach((x,k)=>{const at=(s.at||[])[k]!=null?s.at[k]:0.6+k*0.55;const e=$('li'+i+'_'+k);e.style.opacity=cl((t-at)/.15);e.style.transform='scale('+(t>at?eb((t-at)/.3):0.6)+')';e.style.transformOrigin='left center';});}};

T.cta={html:(i,s)=>`<div class="ab" style="left:90px;top:300px;width:120px;height:120px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center"><img src="__ICON__" style="width:96px"></div>
<div class="ab M" id="a${i}" style="left:90px;right:90px;top:480px;font-size:${s.size||104}px;color:${ink(s)}">${s.title}</div>
<div class="ab" id="btn${i}" style="left:90px;right:90px;top:${s.btnTop||870}px;height:170px;border-radius:85px;background:#fff;display:flex;align-items:center;justify-content:center;gap:24px"><span class="M" style="font-size:58px;color:#0E1A2B;letter-spacing:-1px">${s.button||'Agendar diagnóstico'}</span><svg width="64" height="64" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" stroke="#8A3FD1" stroke-width="3" fill="none" stroke-linecap="round"/></svg></div>
<div class="ab S" id="b${i}" style="left:90px;right:90px;top:${(s.btnTop||870)+220}px;font-size:76px;color:${s.accent||'#F1E6FB'};text-align:center">${s.sub||'gratuito, com um especialista'}</div>`,
 tick:(i,s,t)=>{rise($('a'+i),t,0.05);rise($('btn'+i),t,0.4,.5,80);const b=$('btn'+i);if(t>1.0){b.style.transform='scale('+(1+0.035*Math.sin((t-1.0)*6))+')';}rise($('b'+i),t,0.9);}};

// montar cenas
let H='';SPEC.scenes.forEach((s,i)=>{H+=`<div class="sc" id="s${i}" style="background:${s.bg}">`+T[s.type].html(i,s)+'</div>';});$('scenes').innerHTML=H;
SPEC.scenes.forEach((s,i)=>{if(T[s.type].init)T[s.type].init(i,s);});
const chunks=[];SC.forEach(s=>{const w=s.text.split(' ');const groups=[];let cur=[];w.forEach(x=>{cur.push(x);if(cur.join(' ').length>=16||/[.,:?!]$/.test(x)){groups.push(cur.join(' '));cur=[];}});if(cur.length)groups.push(cur.join(' '));const tot=groups.reduce((a,b)=>a+b.length,0);let t=s.start;groups.forEach(gp=>{const d=s.dur*gp.length/tot;chunks.push([t,t+d,gp]);t+=d;});});
window.__tick=function(t){
 const B=SC.map((s,i)=>[i==0?0:s.start-0.15,i<SC.length-1?SC[i+1].start-0.15:TOTAL+1]);
 let cur=0;B.forEach((b,i)=>{const on=t>=b[0]&&t<b[1];const el=$('s'+i);el.style.opacity=on?1:0;if(on){cur=i;const p=eo((t-b[0])/.3);el.style.transform='scale('+(1.04-.04*p)+')';T[SPEC.scenes[i].type].tick(i,SPEC.scenes[i],t-b[0],b[1]-b[0]);}});
 const bg=SPEC.scenes[cur].bg;const lt=LIGHT(bg);
 $('chrome').style.color=lt?'#0E1A2B':'#fff';$('chrome').style.opacity=SPEC.scenes[cur].type=='cta'?0:1;
 const c=chunks.find(c=>t>=c[0]&&t<c[1]+0.05);const cap=$('capt');cap.textContent=c?c[2]:'';cap.style.opacity=c?1:0;
 cap.style.background=lt?'#0E1A2B':'#FFFFFF';cap.style.color=lt?'#FFFFFF':'#0E1A2B';
};
</script></body></html>
